# Take over a Claude Code alias: `haiku` (and Claude Code's background tasks, and any agent or Agent tool
# call that asks for haiku) then runs on this model. Other tiers: sonnet, opus, fable, subagent (the
# default subagent model), default (the model new sessions start on).
# [[model]]
# id = "local-haiku"
# upstream = "http://127.0.0.1:8003"
# upstream_model = "Qwen/Qwen3.8-Flash-Next"
